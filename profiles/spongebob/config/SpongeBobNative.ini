; SpongeBob's Truth or Square (ULUS-10478) — SpongeBobNative configuration.
; Renderer, platform and audio code adapted from elmasas/lcs-recomp (MIT).

[Display]
Fullscreen=false
UpscaleFilter=Bilinear
IntegerScale=false
ShowFPS=false
VSync=true

[Rendering]
; Linux uses the Vulkan GE. "DirectX12" is Windows-only and is not wired here.
Backend=Vulkan
; PSP = native 480x272 internal target. Use Scale + InternalScale for upscaling.
InternalResolutionMode=PSP
InternalScale=1
MSAA=1
AnisotropicFiltering=1

[Widescreen]
Enabled=false
AspectRatio=auto

[Controls]
MouseSensitivity=12

[Timing]
FrameRate=60
